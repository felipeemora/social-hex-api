definitions:
  dto.CreatePostRequestDTO:
    properties:
      content:
        example: This is the content of my first post
        maxLength: 1000
        minLength: 3
        type: string
      tags:
        example:
        - first
        - post
        items:
          type: string
        type: array
      title:
        example: My first post
        maxLength: 100
        minLength: 3
        type: string
      user_id:
        type: integer
    required:
    - content
    - title
    type: object
  dto.CreateTokenRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  dto.CreateTokenResponse:
    properties:
      token:
        type: string
    type: object
  dto.CreateUserRequestDTO:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
      role_name:
        type: string
      username:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - email
    - password
    - role_name
    - username
    type: object
  dto.PostSuccessAPIResponse:
    properties:
      data:
        $ref: '#/definitions/dto.PostWithMetadata'
    type: object
  dto.PostWithMetadata:
    properties:
      content:
        example: This is the content of my first post
        maxLength: 1000
        minLength: 3
        type: string
      id:
        type: integer
      tags:
        example:
        - first
        - post
        items:
          type: string
        type: array
      title:
        example: My first post
        maxLength: 100
        minLength: 3
        type: string
      user_id:
        type: integer
    required:
    - content
    - title
    type: object
  dto.UserResponseDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      invitation_id:
        type: string
      is_active:
        type: boolean
      username:
        type: string
    type: object
  entrypoints.ErrorAPIResponse:
    properties:
      error:
        type: string
      metadata:
        additionalProperties: {}
        type: object
    type: object
info:
  contact:
    email: felipemora@mail.com
    name: Felipe Mora
  description: This is a server for a social media application.
  title: Social Hex API
paths:
  /authentication/token:
    post:
      consumes:
      - application/json
      description: create a new token for a user
      parameters:
      - description: User token creation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User token created successfully
          schema:
            $ref: '#/definitions/dto.CreateTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
      summary: Create Token
      tags:
      - authentication
  /posts:
    post:
      consumes:
      - application/json
      description: create a new post
      parameters:
      - description: Post creation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePostRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Post created successfully
          schema:
            $ref: '#/definitions/dto.PostSuccessAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
      summary: Create Post
      tags:
      - posts
  /users:
    post:
      consumes:
      - application/json
      description: create a new user
      parameters:
      - description: User creation payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
      summary: Create User
      tags:
      - users
  /users/activate/{invitationID}:
    put:
      consumes:
      - application/json
      description: Activate a registered user using an invitation ID
      parameters:
      - description: Invitation ID
        in: path
        name: invitationID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User activated
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/entrypoints.ErrorAPIResponse'
      summary: Activate a registered user
      tags:
      - users
swagger: "2.0"
